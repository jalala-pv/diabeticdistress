
{% extends 'users/users_home.html' %}
{% block body %}

<style>
    /* Professional Medical-Dark Theme Variables */
    :root {
        --primary-cyan: #06A3DA;
        --dark-navy: #091E3E;
        --card-bg: #11233E;
        --input-bg: rgba(255, 255, 255, 0.05);
        --text-muted: #A0B3CE;
    }

    .prediction-section {
        padding: 60px 0;
        min-height: 90vh;
        display: flex;
        align-items: center;
        background-color: var(--dark-navy);
    }

    .prediction-card {
        background: var(--card-bg);
        border-radius: 20px;
        padding: 40px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        max-width: 900px;
        margin: auto;
    }

    /* Header Section */
    .header-box {
        text-align: center;
        margin-bottom: 40px;
    }

    .icon-circle {
        width: 70px;
        height: 70px;
        background: var(--primary-cyan);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        box-shadow: 0 0 20px rgba(6, 163, 218, 0.4);
        color: white;
        font-size: 28px;
    }

    .header-box h2 {
        color: var(--primary-cyan);
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 10px;
    }

    .header-box p {
        color: var(--text-muted);
        font-size: 0.95rem;
    }

    /* Form Grid Styling */
    .form-label-custom {
        color: #fff;
        font-weight: 700;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 10px;
        display: block;
    }

    .form-control-modern {
        background: var(--input-bg);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 14px 18px;
        color: #fff;
        font-size: 1rem;
        transition: all 0.3s ease;
        width: 100%;
    }

    .form-control-modern:focus {
        background: rgba(255, 255, 255, 0.08);
        border-color: var(--primary-cyan);
        box-shadow: 0 0 15px rgba(6, 163, 218, 0.2);
        outline: none;
        color: #fff;
    }

    /* Gender Toggle Styling */
    .gender-container {
        display: flex;
        gap: 10px;
    }

    .gender-option {
        flex: 1;
        position: relative;
    }

    .gender-option input {
        display: none;
    }

    .gender-label {
        display: block;
        padding: 12px;
        text-align: center;
        background: var(--input-bg);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        color: #fff;
        cursor: pointer;
        font-weight: 700;
        transition: 0.3s;
    }

    .gender-option input:checked + .gender-label {
        background: var(--primary-cyan);
        border-color: var(--primary-cyan);
        box-shadow: 0 0 15px rgba(6, 163, 218, 0.3);
    }

    /* Submit Button */
    .btn-submit-glow {
        background: var(--primary-cyan);
        color: white;
        border: none;
        padding: 16px 50px;
        border-radius: 12px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 2px;
        transition: all 0.3s;
        box-shadow: 0 8px 25px rgba(6, 163, 218, 0.4);
        display: block;
        width: fit-content;
        margin: 30px auto 0;
    }

    .btn-submit-glow:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 30px rgba(6, 163, 218, 0.6);
        background: #058cb9;
    }

    /* Result Result Styling */
    .result-alert {
        background: rgba(6, 163, 218, 0.1);
        border: 1px solid var(--primary-cyan);
        padding: 20px;
        border-radius: 15px;
        margin-top: 30px;
        text-align: center;
        color: #fff;
    }

    .result-alert h4 {
        color: var(--primary-cyan);
        font-weight: 800;
        margin-bottom: 5px;
    }
</style>

<div class="prediction-section">
    <div class="container">
        <div class="prediction-card">

            <div class="header-box">
                <div class="icon-circle">
                    <i class="fas fa-microscope"></i>
                </div>
                <h2>Diabetes Prediction Portal</h2>
                <p>Input clinical markers to generate immediate health insights</p>
            </div>

            <form method="post" action="/myapp/upload_logs_post/">
                {% csrf_token %}

                <div class="row g-4">
                    <div class="col-md-6">
                        <label class="form-label-custom">Patient Age</label>
                        <input type="text" class="form-control-modern" name="age" placeholder="Years" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label-custom">Hypertension Status</label>
                        <input type="text" class="form-control-modern" name="hypertension" placeholder="0 = No, 1 = Yes" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label-custom">Gender Selection</label>
                        <div class="gender-container">
                            <div class="gender-option">
                                <input type="radio" value="Male" name="gender" id="male" required>
                                <label class="gender-label" for="male">MALE</label>
                            </div>
                            <div class="gender-option">
                                <input type="radio" value="Female" name="gender" id="female" required>
                                <label class="gender-label" for="female">FEMALE</label>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label-custom">Heart Disease</label>
                        <input type="text" class="form-control-modern" name="heartdisease" placeholder="0 = No, 1 = Yes" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label-custom">Smoking History</label>
                        <input type="text" class="form-control-modern" name="smokinghistory" placeholder="e.g. Never, Current, Former" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label-custom">BMI (Body Mass Index)</label>
                        <input type="text" class="form-control-modern" name="bmi" placeholder="Weight (kg) / Height²" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label-custom">HbA1c Level</label>
                        <input type="text" class="form-control-modern" name="hba1clevel" placeholder="Average Blood Sugar" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label-custom">Blood Glucose Level</label>
                        <input type="text" class="form-control-modern" name="bloodglucoselevel" placeholder="Current Glucose (mg/dL)" required>
                    </div>
                </div>

                <button type="submit" class="btn-submit-glow">
                    Generate Prediction
                </button>

                {% if result %}
                <div class="result-alert">
                    <h4>Analysis Result</h4>
                    <p class="m-0">{{ result }}</p>
                </div>
                {% endif %}
            </form>
        </div>
    </div>
</div>

{% endblock %}
